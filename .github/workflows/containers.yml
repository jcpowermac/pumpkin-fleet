name: containers

# Builds the four server images on GitHub's runners and pushes them to ghcr.io.
# The uCore VMs never need a build toolchain or a source checkout — they pull
# ghcr.io/<owner>/<repo>/<image>:<version> and nothing else.
#
# Versions and sha256 pins live in containers/images.json (single source of truth),
# which this workflow reads to build the matrix. To bump a server: edit that file,
# open a PR, merge. The version tag changes with it, so the deploy is a one-line
# change in configs/pins.env.
#
# Two rules shape the jobs below:
#   * scripts/ci_gate.py rejects any change that would publish different bytes under a
#     version tag ghcr.io already has, and picks the matrix: an image whose entry did
#     not change is skipped, so its tag is never rebuilt with a new digest.
#   * A merge builds <image>:<version> and <image>:stable-next. Only the canary node
#     follows stable-next; a human then dispatches `promote`, which moves <image>:stable
#     to that same digest. stable/stable-next are the only moving tags.

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - '.github/workflows/containers.yml'
  pull_request:
    paths:
      - 'containers/**'
      - '.github/workflows/containers.yml'
  workflow_dispatch:
    inputs:
      image:
        description: image name to promote (images.json name, e.g. papermc)
        required: true
        type: string
      digest:
        description: sha256 digest of that image's stable-next to promote to stable
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.gate.outputs.images }}
      prefix: ${{ steps.prefix.outputs.prefix }}
    steps:
      # The gate needs the manifest at the commit being replaced, which is not always
      # HEAD^ (a merge commit's first parent is the PR tip, not the old main).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: gate
        # A dispatch run is a promote, not a build, so there is nothing to gate or matrix.
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          git show "${BASE:-HEAD^}:containers/images.json" > /tmp/base.json
          uv run python scripts/ci_gate.py \
            --base /tmp/base.json --head containers/images.json --matrix > /tmp/matrix.json
          echo "images=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

      # Docker requires a lowercase repository name; GitHub owners may not be.
      - id: prefix
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    # A dispatch is promote-only: rebuilding here would re-push tags the merge already published.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # images.json stores args as an object; docker/build-push-action wants KEY=VALUE lines.
      # PLUGIN_TRIPLETS is the same file's plugin list flattened to
      # `url install_as sha256` triples for the image's plugins build stage. Images with
      # no plugins legitimately pass an empty value; the stage itself refuses an empty
      # arg for images that declare plugins.
      - id: args
        env:
          ARGS: ${{ toJSON(matrix.image.args) }}
          IMAGE: ${{ matrix.image.name }}
        run: |
          {
            echo 'args<<__ARGS__'
            echo "$ARGS" | jq -r 'to_entries[] | "\(.key)=\(.value)"'
            echo "PLUGIN_TRIPLETS=$(jq -r --arg n "$IMAGE" '.[] | select(.name==$n) | .plugins[]? | "\(.url) \(.install_as) \(.sha256)"' containers/images.json | paste -sd' ' -)"
            echo '__ARGS__'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          # One context for all four: the plugin seed script lives in containers/lib,
          # outside any single image directory.
          context: containers
          dockerfile: containers/${{ matrix.image.name }}/Dockerfile
          build-args: ${{ steps.args.outputs.args }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # No `latest` tag on purpose: deploys pin an exact version, so an image
          # can never change under a running system. stable-next is the canary channel
          # for this same build; the version tag is what gets audited.
          tags: |
            ${{ needs.matrix.outputs.prefix }}/${{ matrix.image.name }}:${{ matrix.image.version }}
            ${{ needs.matrix.outputs.prefix }}/${{ matrix.image.name }}:stable-next
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.image.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  # stable is the tag every node pulls, and it moves only here. The dispatcher reads the
  # digest off the build run and names it; stable is set to that exact digest, never to a
  # tag or an image CI did not build. A stale or mistyped digest fails the comparison.
  promote:
    if: github.event_name == 'workflow_dispatch'
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote stable-next to stable
        env:
          PREFIX: ${{ needs.matrix.outputs.prefix }}
          IMAGE: ${{ github.event.inputs.image }}
          DIGEST: ${{ github.event.inputs.digest }}
        run: |
          if ! [[ "$IMAGE" =~ ^[a-z0-9-]+$ ]]; then
            echo "image must be an images.json image name" >&2; exit 1
          fi
          digest="${DIGEST#sha256:}"
          if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "digest must be a 64-hex sha256" >&2; exit 1
          fi

          docker pull "$PREFIX/$IMAGE:stable-next"
          built="$(docker inspect --format '{{index .RepoDigests 0}}' "$PREFIX/$IMAGE:stable-next")"
          if [[ "$built" != *"@sha256:$digest" ]]; then
            echo "refusing: $PREFIX/$IMAGE:stable-next is at ${built##*@}, not sha256:$digest" >&2
            exit 1
          fi

          # Tag the verified digest itself, not the floating stable-next tag.
          docker tag "$built" "$PREFIX/$IMAGE:stable"
          docker push "$PREFIX/$IMAGE:stable"
