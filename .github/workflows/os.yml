name: os

# Builds the fleet OS image with BlueBuild and pushes it to ghcr.io/jcpowermac/pumpkin-os.
# Nodes then rebase onto it instead of layering packages with rpm-ostree, which keeps the
# base immutable and makes "what is on this machine" answerable from one recipe.
#
# Layout mirrors jcpowermac/os: recipes/*.yml + files/system/** , built by the BlueBuild
# reusable action. Matches on paths so container-only changes don't rebuild the OS.

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'files/**'
      - '.github/workflows/os.yml'
  pull_request:
    paths:
      - 'recipes/**'
      - 'files/**'
  schedule:
    # Daily, after the ublue base images publish, so we pick up base fixes.
    - cron: '00 06 * * *'
  workflow_dispatch:
    inputs:
      digest:
        description: sha256 digest of pumpkin-os:latest (the canary build to promote to :stable)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    # A dispatch with a digest is a promote run: rebuilding here would re-push :latest under
    # the canary node and move the digest the promote job is being asked to verify.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.digest == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by the action for keyless cosign attestation.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - fleet.yml
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13.0
        with:
          recipe: ${{ matrix.recipe }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          # Images are unsigned for now. BlueBuild signs by default and hard-fails
          # without a keypair ("Unable to find private/public key pair"). To turn
          # signing on: `cosign generate-key-pair`, commit cosign.pub, set a
          # SIGNING_SECRET repo secret, add `- type: signing` to recipes/fleet.yml,
          # pass cosign_private_key below and drop this --no-sign.
          build_opts: --no-sign

  # The OS channel. BlueBuild's daily build moves :latest (plus dated build tags), and pins.env
  # puts the canary node on :latest (OS_TAG_CANARY) while every other node runs :stable
  # (OS_TAG). :stable therefore moves only by this dispatch, through scripts/promote.sh — the
  # same guard and the same registry-side retag the server images use, with EXPECTED_TAG
  # narrowed to the canary tag so a stale dated build, or :stable's own digest, cannot be
  # reported as a promotion.
  promote-os:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote pumpkin-os:stable to the canary digest
        env:
          DIGEST: ${{ github.event.inputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -a; source configs/pins.env; set +a
          PREFIX="${OS_IMAGE%/*}" IMAGE="${OS_IMAGE##*/}" EXPECTED_TAG="$OS_TAG_CANARY" \
            bash scripts/promote.sh
