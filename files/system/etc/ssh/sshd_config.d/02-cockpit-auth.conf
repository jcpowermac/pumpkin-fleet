# Cockpit's privileged container authenticates by logging in over SSH to this host,
# using the host's users and passwords (cockpit-project.org/running.html#coreos).
# That requires password auth for that one path only - restricted to loopback so it
# is never exposed to the network. The sane-looking global alternative would let
# anyone on VLAN 45 password-guess SSH.
Match Address 127.0.0.1,::1
  PasswordAuthentication yes
