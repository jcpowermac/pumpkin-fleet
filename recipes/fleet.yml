---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Published as ghcr.io/jcpowermac/pumpkin-os
name: pumpkin-os
description: uCore base for the pumpkin Minecraft fleet - host sssd so Cockpit can log in.

# uCore is what the VMs already run (see docs/spike-notes.md). This image adds only what
# the fleet needs baked in, instead of rpm-ostree layering it onto every node by hand.
base-image: ghcr.io/ublue-os/ucore
image-version: stable

modules:
  # Some rpm %pre scriptlets `touch /var/lib/rpm-state/...`. That dir belongs to the
  # `filesystem` rpm, but ostree container roots have an empty /var, so transactions
  # fail without it. Same workaround jcpowermac/os uses.
  - type: script
    snippets:
      - "mkdir -p /var/lib/rpm-state"

  # `dnf`, not `rpm-ostree`: the build runs in a container, where the rpm-ostree module
  # aborts with "This system was not booted via libostree".
  - type: dnf
    install:
      packages:
        # Cockpit's privileged container authenticates by logging in over SSH to the
        # host, so the HOST needs a real NSS/PAM provider (see
        # cockpit-project.org/running.html#coreos). uCore ships sssd-ldap but NOT the
        # sssd daemon, so LDAP/authentik Cockpit login cannot work as shipped.
        - sssd
        - sssd-ldap
        - sssd-tools
        # Creates the home directory on first login for LDAP users.
        - oddjob-mkhomedir
        # Already in uCore; listed explicitly so a base-image change cannot silently
        # drop the guest agent that qm agent and the fleet's IP checks rely on.
        - qemu-guest-agent
        # The node-side fleet scripts (reboot gate, plugin verification) run on python3,
        # and neither FCOS nor uCore guarantees it in the base.
        - python3

  # NOTE: no sshd drop-in and no `Include` patch here, and that is deliberate. uCore
  # already ships /etc/ssh/sshd_config.d/90-enable-localhost-passwords.conf:
  #
  #   # uCore modification
  #   # enables Cockpit web login without exposing password auth to network
  #   Match Address 127.0.0.1,::1
  #     PasswordAuthentication yes
  #
  # and its sshd_config already has `Include /etc/ssh/sshd_config.d/*.conf` (line 15).
  # Verified with `sshd -T -C addr=127.0.0.1,user=core` -> yes, `-C addr=<vlan peer>` -> no.
  # An earlier version of this recipe added both and was redundant.

  # Signing is deliberately off: it needs a SIGNING_SECRET secret and a `cosign.pub`
  # in the repo, and the nodes rebase with ostree-unverified-registry anyway (see
  # docs/spike-notes.md). To enable: `cosign generate-key-pair`, commit cosign.pub,
  # set SIGNING_SECRET, add `- type: signing` here, pass cosign_private_key in
  # .github/workflows/os.yml and drop the --no-sign build opt.
